<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form | Air University</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <form class="registration-form" action="#" method="post" enctype="multipart/form-data">

        <h1>Student Registration Form</h1>

        <!-- 1. Full Name -->
        <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>
        </div>

        <!-- 2. Father's Name -->
        <div class="form-group">
            <label for="fatherName">Father's Name</label>
            <input type="text" id="fatherName" name="fatherName" placeholder="Enter your father's name" required>
        </div>

        <!-- 3. Registration Number -->
        <div class="form-group">
            <label for="regNo">Registration Number</label>
            <input type="text" id="regNo" name="regNo" placeholder="e.g. 251234" required>
        </div>

        <!-- 4. Email Address -->
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="name@example.com" required>
        </div>

        <!-- 5. Password -->
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Minimum 8 characters" minlength="8" required>
        </div>

        <!-- 6. Confirm Password -->
        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" minlength="8" required>
        </div>

        <!-- 7. Date of Birth -->
        <div class="form-group">
            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" name="dob" required>
        </div>

        <!-- 8. Gender (Radio Buttons) -->
        <div class="form-group">
            <span class="group-title">Gender</span>
            <div class="radio-group">
                <label class="option-label" for="genderMale">
                    <input type="radio" id="genderMale" name="gender" value="male" required> Male
                </label>
                <label class="option-label" for="genderFemale">
                    <input type="radio" id="genderFemale" name="gender" value="female"> Female
                </label>
                <label class="option-label" for="genderOther">
                    <input type="radio" id="genderOther" name="gender" value="other"> Other
                </label>
            </div>
        </div>

        <!-- 9. Department (Dropdown) -->
        <div class="form-group">
            <label for="department">Department</label>
            <select id="department" name="department" required>
                <option value="" disabled selected>Select your department</option>
                <option value="BSSE">BSSE</option>
                <option value="BSAI">BSAI</option>
                <option value="BSDS">BSDS</option>
                <option value="BSCS">BSCS</option>
            </select>
        </div>

        <!-- 10. Semester (Dropdown) -->
        <div class="form-group">
            <label for="semester">Semester</label>
            <select id="semester" name="semester" required>
                <option value="" disabled selected>Select your semester</option>
                <option value="1">1st</option>
                <option value="2">2nd</option>
                <option value="3">3rd</option>
                <option value="4">4th</option>
                <option value="5">5th</option>
                <option value="6">6th</option>
                <option value="7">7th</option>
                <option value="8">8th</option>
            </select>
        </div>

        <!-- 11. Phone Number -->
        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="03XX-XXXXXXX" pattern="[0-9]{4}-?[0-9]{7}" title="Format: 03XX-XXXXXXX" required>
        </div>

        <!-- 12. Permanent Address -->
        <div class="form-group">
            <label for="address">Permanent Address</label>
            <textarea id="address" name="address" rows="3" placeholder="Enter your permanent address" required></textarea>
        </div>

        <!-- 13. Profile Picture (File Input) -->
        <div class="form-group">
            <label for="profilePic">Profile Picture</label>
            <input type="file" id="profilePic" name="profilePic" accept="image/*" required>
        </div>

        <!-- 14. Terms and Conditions (Checkbox) -->
        <div class="form-group">
            <label class="option-label" for="terms">
                <input type="checkbox" id="terms" name="terms" required>
                I agree to the Terms and Conditions
            </label>
        </div>

        <!-- 15. Buttons -->
        <div class="button-group">
            <button type="submit" class="btn btn-register">Register</button>
            <button type="reset" class="btn btn-reset">Reset</button>
        </div>

    </form>
    </form>

    <!-- Footer -->
    <footer class="site-footer">
        <p>&copy; 2026 @hassanihsan. All rights reserved.</p>
    </footer>

</body>
</body>
</html>
